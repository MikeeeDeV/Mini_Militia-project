name: "🐛 Bug Report"
description: "Report a build error, crash, install failure, or runtime issue on modern Android"
title: "fix: [Short summary of bug]"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue! Please provide as much technical context as possible to help us reproduce and resolve the problem quickly.

  - type: input
    id: os_version
    attributes:
      label: Android OS Version & API Level
      description: "e.g., Android 14 (API 34), Android 13 (API 33), Android 12 (API 31)"
      placeholder: "e.g., Android 14 (OneUI 6.1)"
    validations:
      required: true

  - type: input
    id: device_model
    attributes:
      label: Device Hardware Model
      description: "e.g., Google Pixel 8, Samsung Galaxy S23, Xiaomi Poco F5"
      placeholder: "e.g., Samsung Galaxy S23"
    validations:
      required: true

  - type: dropdown
    id: release_version
    attributes:
      label: Affected APK Release / Build
      description: "Which build or release artifact encountered the problem?"
      options:
        - "v4.2.8-family-dev.5 (Latest)"
        - "v4.2.8-fps.3 (120 FPS Build)"
        - "v4.2.8-compat.2 (Compatibility Build)"
        - "Local Custom Build (Compiled from Source)"
        - "Other (Specify in description)"
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: "Step-by-step instructions to trigger the issue."
      placeholder: |
        1. Compile APK with 'python3 scripts/build_and_deploy_apk.py'
        2. Install on Android 14 device via ADB
        3. Launch game and navigate to 'Quick Play'
        4. Observe crash or error dialog
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: "What did you expect to happen?"
      placeholder: "The game should launch seamlessly into the main menu without crashing."
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior
      description: "What actually happened? Include error messages or crash dialogues."
      placeholder: "App crashes immediately with INSTALL_FAILED_NO_MATCHING_ABIS or stops upon start."
    validations:
      required: true

  - type: textarea
    id: logcat_output
    attributes:
      label: Logcat / Terminal Logs
      description: "Paste relevant 'adb logcat' snippets, Apktool logs, or stack traces."
      render: shell
      placeholder: |
        $ adb logcat -d -s AndroidRuntime:E
        FATAL EXCEPTION: main
        Process: com.appsomniacs.da2, PID: 12345
        ...
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Verification Checklist
      options:
        - label: "I have verified that this issue is not already reported in existing open issues."
          required: true
        - label: "I have tested with a clean build from the main branch."
          required: false
